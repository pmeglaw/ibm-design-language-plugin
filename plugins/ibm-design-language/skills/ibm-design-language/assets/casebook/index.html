<!doctype html><html lang="en" data-theme="white"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBM / Carbon composition casebook</title><link rel="stylesheet" href="casebook.css"></head><body><header class="viewer-head"><div class="eyebrow">IBM / Carbon craft studies · Casebook 1</div><h1>Decisions you can see.</h1><p class="subhead">Five original before/after studies. Read the task, compare the composition, then examine the tradeoffs. These are teaching examples, not benchmark scores.</p><div class="viewer-controls"><label>Study<select id="case"></select></label><label>Theme<select id="theme"><option value="white">White</option><option value="g100">Gray 100</option></select></label><label>Capture<select id="width"><option value="desktop">1440px desktop</option><option value="mobile">390px mobile</option></select></label></div></header><main class="case-content"><div id="content"></div></main><script src="cases.js"></script><script>
const select=document.getElementById("case"),theme=document.getElementById("theme"),width=document.getElementById("width"),content=document.getElementById("content");
const esc=s=>s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
CASEBOOK.forEach((c,i)=>{let o=document.createElement("option");o.value=c.id;o.textContent=String(i+1).padStart(2,"0")+" / "+c.type;select.append(o)});
function render(){
 const c=CASEBOOK.find(c=>c.id===select.value),t=theme.value,w=width.value;
 document.documentElement.dataset.theme=t;
 const figure=(v,label,description)=>{const src="screens/"+c.id+"-"+v+"-"+t+"-"+w+".png";return '<figure><figcaption><strong>'+label+'</strong>'+esc(description)+'</figcaption><a class="image-link" href="'+src+'" aria-label="Open '+label.toLowerCase()+' capture"><img src="'+src+'" alt="'+esc(c.type)+" "+label.toLowerCase()+" composition at "+w+' width; numbered annotations explained below."></a></figure>'};
 content.innerHTML='<section class="case-heading"><div class="eyebrow">'+esc(c.type)+'</div><h2 aria-live="polite">'+esc(c.title)+'</h2><p><strong>Task:</strong> '+esc(c.task)+'</p></section><div class="compare '+w+'">'+figure("before","Original",c.before)+figure("after","Revised",c.after)+'</div><div class="study-links"><a href="studies/'+c.id+'-before.html?theme='+t+'">Open original study</a><a href="studies/'+c.id+'-after.html?theme='+t+'">Open revised study</a></div><section class="annotations" aria-label="Design annotations">'+c.annotations.map((a,i)=>'<article><h3><span class="pin">'+(i+1)+'</span>'+esc(a.title)+'</h3><p>'+esc(a.why)+'</p><p class="cost"><strong>Tradeoff:</strong> '+esc(a.tradeoff)+'</p><p><strong>Alternative:</strong> '+esc(a.alternative)+'</p></article>').join("")+'</section><section class="exercise"><h3>Try a different constraint</h3><p>'+esc(c.exercise)+'</p></section><div class="source-list"><strong>Reference routes:</strong> '+c.sources.map(s=>'<a href="'+s[1]+'">'+esc(s[0])+'</a>').join("")+'</div><p class="viewer-note">'+esc(c.scope)+' The studies use bundled IBM Plex Sans and an author-defined semantic role subset. They are static HTML, not Carbon React component implementations. Product interactions, assistive technology and real browser zoom are not certified. Source guidance informs component/type choices; the comparison judgments and tradeoffs are local craft advice.</p>';
}
[select,theme,width].forEach(control=>control.addEventListener("change",render));render();
</script></body></html>
