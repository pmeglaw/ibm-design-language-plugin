name: Verify table guidance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s tests -p test_table_guidance.py
