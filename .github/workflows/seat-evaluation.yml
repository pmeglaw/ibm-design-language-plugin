name: Seat evaluation adapter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Adapter and real evaluator packet regressions (no model calls)
        shell: bash
        run: SEAT_EVAL_PYTHON="$(command -v python)" node --test tests/seat-evaluation.test.cjs
