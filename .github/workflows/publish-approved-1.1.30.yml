name: Publish approved 1.1.30
on:
  push:
    branches: [ops/publish-1.1.30]
    paths: [.github/workflows/publish-approved-1.1.30.yml]
permissions: {}
concurrency:
  group: publish-approved-idl-1.1.30
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pmeglaw/ibm-design-language-plugin' && github.ref == 'refs/heads/ops/publish-1.1.30'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Publish verified release and prepare companion documentation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, os, subprocess, sys, zipfile
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler

          ROOT = Path.cwd()
          REPO = 'pmeglaw/ibm-design-language-plugin'
          RELEASE_SHA = 'cd2ad7c5af0fd7e77079e60b674a57d681d9c0d7'
          CANDIDATE_TREE = '4b0b441141884e6e85464b951f6560489a971a47'
          BRANCH = 'ops/publish-1.1.30'
          WORKFLOW = '.github/workflows/publish-approved-1.1.30.yml'
          VERSION, TAG = '1.1.30', 'v1.1.30'
          ZIP_SHA256 = 'b98c087822c5f840158b36bf344d8a731d6781405b4c9926b8f168bcaca80b36'
          OLD_SHA = 'f7f91e5b5fc4183247a9cf5eafa430ea17f1ecd5'
          OLD_CHECKSUM = '44e43f744f76da3ea71f2bb3c803b42d589813b6fd379986b44192b517b31a68'
          VERIFY_RUN, DOCS_RUN = 38199934591, 38199934603
          API = f'https://api.github.com/repos/{REPO}/'
          RELEASE_URL = f'https://github.com/{REPO}/releases/tag/{TAG}'
          HEADERS = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'approved-idl-release'}
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data=None, method=None, missing=False):
              body = None if data is None else json.dumps(data).encode('utf-8')
              headers = dict(HEADERS)
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              try:
                  with urlopen(Request(API + path, data=body, headers=headers, method=method), timeout=90) as r:
                      return json.load(r)
              except HTTPError as e:
                  if missing and e.code == 404:
                      return None
                  raise
          def run(args):
              result = subprocess.run(args, text=True, capture_output=True, timeout=240)
              print('COMMAND: ' + ' '.join(args) + '\n' + result.stdout + result.stderr, flush=True)
              require(result.returncode == 0, 'Failed command: ' + ' '.join(args))
          def replace_once(text, before, after):
              require(text.count(before) == 1, 'Ambiguous documentation baseline: ' + before[:100])
              return text.replace(before, after)
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8', newline='\n')
          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          require(git('rev-parse', 'HEAD^') == RELEASE_SHA, 'Unexpected operations branch parent')
          require(git('diff', '--name-only', 'HEAD^', 'HEAD') == WORKFLOW, 'Unexpected operations diff')
          require(git('rev-parse', RELEASE_SHA + '^{tree}') == CANDIDATE_TREE, 'Merged tree differs from reviewed candidate')
          require(not git('status', '--porcelain'), 'Dirty checkout')
          require(api('git/ref/heads/main')['object']['sha'] == RELEASE_SHA, 'Main moved; reconcile before publication')
          require(api('git/ref/heads/' + BRANCH)['object']['sha'] == git('rev-parse', 'HEAD'), 'Operations branch moved')
          pr = api('pulls/45')
          require(pr['merged'] and pr['merge_commit_sha'] == RELEASE_SHA, 'PR #45 merge identity mismatch')
          require([p for p in git('ls-files').splitlines() if Path(p).name in ('AGENTS.md', 'AGENTS.override.md', 'CLAUDE.md')] == ['AGENTS.md'], 'Unreviewed nested instructions')
          expected_jobs = {'verify (windows-latest)', 'verify (ubuntu-latest)', 'casebook', 'release-fixture', 'behavior-fixture', 'nextjs-shell'}
          for run_id, expected in [(VERIFY_RUN, expected_jobs), (DOCS_RUN, {'release-docs'})]:
              workflow_run = api(f'actions/runs/{run_id}')
              require(workflow_run['head_sha'] == RELEASE_SHA and workflow_run['event'] == 'push', 'Wrong gate commit or event')
              require(workflow_run['status'] == 'completed' and workflow_run['conclusion'] == 'success', 'Release gate not green')
              jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')
              require(jobs['total_count'] == len(expected), 'Unexpected gate inventory')
              require({j['name'] for j in jobs['jobs']} == expected, 'Required gate missing')
              require(all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs['jobs']), 'A required gate failed')
          latest = api('releases/latest')
          require(latest['tag_name'] in ('v1.1.29', TAG), 'Unexpected newer release; do not supersede it')
          release = api('releases/tags/' + TAG, missing=True)
          tag_ref = api('git/ref/tags/' + TAG, missing=True)
          if tag_ref:
              require(tag_ref['object']['sha'] == RELEASE_SHA and tag_ref['object']['type'] == 'commit', 'Existing tag points elsewhere')

          run([sys.executable, '-B', 'scripts/verify.py'])
          run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'])
          source = ROOT / 'plugins/ibm-design-language'
          require(json.loads((source / 'plugin.json').read_text())['version'] == VERSION, 'Wrong source version')
          assets_dir = ROOT / 'releases' / VERSION
          names = ('plugin.zip', 'files.json', 'SHA256SUMS', 'NOTES.md')
          assets = {name: (assets_dir / name).read_bytes() for name in names}
          require(digest(assets['plugin.zip']) == ZIP_SHA256, 'Approved archive hash mismatch')
          manifest = json.loads(assets['files.json'])
          require(assets['SHA256SUMS'].decode().split() == [ZIP_SHA256, 'plugin.zip'], 'Checksum file mismatch')
          with zipfile.ZipFile(io.BytesIO(assets['plugin.zip'])) as z:
              require({n: digest(z.read(n)) for n in z.namelist()} == manifest and z.testzip() is None, 'ZIP manifest mismatch')
          require(len(manifest) == 170, 'Unexpected package file count')
          frozen = {p.relative_to(ROOT).as_posix(): digest(p.read_bytes()) for p in (ROOT / 'releases').rglob('*') if p.is_file()}

          readme = read('README.md')
          readme = replace_once(readme, 'The current published package is **1.1.29**.', 'The current published package is **1.1.30**.')
          old_paragraph = next(line for line in readme.splitlines() if line.startswith('Version 1.1.29 adds '))
          new_paragraph = ('Version 1.1.30 adds version-aware Context7 retrieval, official-source reconciliation, the dated Carbon/v12/DTCG reference refresh and release-derived review scenarios. It preserves all three skills, application dependencies, runtime assets and existing test gates; it does not enable v12 flags. The scenarios are guidance, not executed model or product tests. See the [published release notes](' + RELEASE_URL + ') for verification and limits. The earlier [1.1.27 provenance erratum](docs/1.1.27-PROVENANCE-ERRATUM.md) remains applicable to its frozen header evidence.')
          readme = replace_once(readme, old_paragraph, new_paragraph)
          old_paragraph = next(line for line in readme.splitlines() if line.startswith('The working source is '))
          new_paragraph = (f'The working package matches published **1.1.30**, released from commit `{RELEASE_SHA}`. The frozen [preparation notes](releases/1.1.30/NOTES.md) and packaged notes retain candidate wording; the GitHub release is the authoritative publication record. Earlier archives, manifests and checksums remain unchanged. Publication and downloaded-byte verification are separate from destination installation and fresh skill discovery.')
          readme = replace_once(readme, old_paragraph, new_paragraph)
          readme = readme.replace('https://github.com/' + REPO + '/releases/tag/v1.1.29', RELEASE_URL)
          old_entry = next(line for line in readme.splitlines() if line.startswith('- `plugins/ibm-design-language/`:'))
          readme = replace_once(readme, old_entry, '- `plugins/ibm-design-language/`: the published 1.1.30 package source with its three skills, references, visual casebook, assets, evaluator, and tests; its published archive and manifest are in `releases/1.1.30/`.')
          write('README.md', readme)
          recovery = read('docs/RECOVERY.md')
          current, rest = recovery.split('## Uploaded account installations', 1)
          current = current.replace('1.1.29', VERSION).replace(OLD_SHA, RELEASE_SHA).replace(OLD_CHECKSUM, ZIP_SHA256)
          recovery = current + '## Uploaded account installations' + rest
          recovery = replace_once(recovery, '## Previous release rollback identity\n\n', f'## Previous release rollback identity\n\nVersion 1.1.29: commit `{OLD_SHA}`, tag `v1.1.29`, ZIP SHA-256 `{OLD_CHECKSUM}`. Its frozen archive and manifest remain in `releases/1.1.29/`.\n\n')
          write('docs/RECOVERY.md', recovery)
          write('docs/INSTALLATION.md', read('docs/INSTALLATION.md').replace('1.1.29', VERSION))
          history = read('docs/HISTORY.md')
          history = replace_once(history, 'The current published plugin package is 1.1.29;', 'The current published plugin package is 1.1.30;')
          first, entries = history.split('\nVersion ', 1)
          first = first.replace('https://github.com/' + REPO + '/releases/tag/v1.1.29', RELEASE_URL)
          history = first + '\nVersion ' + entries
          history_entry = (f'Version 1.1.30 adds version-aware Context7 retrieval, the dated Carbon/v12/DTCG reference refresh and release-derived review scenarios. The [published release]({RELEASE_URL}) records publication from `{RELEASE_SHA}`. All six required release CI jobs and the release-documentation check passed on that exact merged commit. Release execution also verified 170 packaged files, 333 local links and all 38 repository regressions. All four downloaded release assets match the committed bytes. The original three-file refresh, runtime assets, fixture assertions, dependencies and previous releases remain unchanged. No fresh model generation, Seat Planner runtime verification, native Windows high-contrast test or screen-reader test ran. Frozen preparation notes retain candidate wording. Destination installation and fresh discovery remain separate steps.\n\n')
          history = replace_once(history, 'The [release fixture]', history_entry + 'The [release fixture]')
          write('docs/HISTORY.md', history)
          changed = ['README.md', 'docs/HISTORY.md', 'docs/INSTALLATION.md', 'docs/RECOVERY.md']
          require(set(git('diff', '--name-only').splitlines()) == set(changed), 'Unexpected documentation scope')
          require({p.relative_to(ROOT).as_posix(): digest(p.read_bytes()) for p in (ROOT / 'releases').rglob('*') if p.is_file()} == frozen, 'Frozen release file changed')
          require(not git('diff', '--name-only', '--', 'plugins', 'scripts', 'tests', 'releases'), 'Package, verifier or fixture drift')
          run([sys.executable, '-B', 'scripts/verify_release_docs.py'])
          run(['git', 'diff', '--check'])

          body = (f'Add version-aware Context7 documentation retrieval, official-source verification, bounded fallback and privacy/permission rules. Refresh dated Carbon v11.118.0, v12 preview/export and DTCG token-source guidance. Add release-derived review scenarios for navigation, forced-colors input focus, table selection and code-snippet keyboard access.\n\n'
                  f'Release commit: `{RELEASE_SHA}` (owner-approved PR #45). All six required [release CI jobs](https://github.com/{REPO}/actions/runs/{VERIFY_RUN}) passed on this exact merged commit: Windows and Linux package verification, casebook renderer, geometry fixture, keyboard fixture and Next.js production build/shell. The [release-documentation check](https://github.com/{REPO}/actions/runs/{DOCS_RUN}) also passed before publication.\n\n'
                  'Release execution verified 170 packaged files, 333 local links, historical archives, synthetic evaluator checks and all 38 repository regression tests. The approved three-file reference refresh, all three skills, runtime assets, fixture assertions, dependencies and previous release bytes are preserved. No Seat Planner code or v12 flags changed.\n\n'
                  f'ZIP SHA-256: `{ZIP_SHA256}`.\n\n'
                  'Frozen package/preparation notes retain candidate wording; this release establishes publication. The four uploaded assets are byte-checked before publication. Public downloaded-byte verification is recorded separately in the release workflow and PR #45. Destination installation and fresh skill discovery are separate and have not been performed. No fresh model evaluation, Seat Planner runtime test, native Windows high-contrast test or screen-reader test is claimed. Passing fixtures do not certify general product quality or accessibility.')
          if not tag_ref:
              tag_ref = api('git/refs', {'ref': 'refs/tags/' + TAG, 'sha': RELEASE_SHA})
          require(tag_ref['object']['sha'] == RELEASE_SHA and tag_ref['object']['type'] == 'commit', 'Release tag mismatch')
          if release is None:
              release = api('releases', {'tag_name': TAG, 'target_commitish': RELEASE_SHA,
                            'name': 'IBM Design Language 1.1.30 — Context7 reference refresh', 'body': body,
                            'draft': True, 'prerelease': False, 'make_latest': 'false'})
          require(release['tag_name'] == TAG and release['target_commitish'] == RELEASE_SHA, 'Release identity mismatch')
          existing_assets = api(f"releases/{release['id']}/assets?per_page=100")
          require(len(existing_assets) == len({a['name'] for a in existing_assets}), 'Duplicate assets')
          require({a['name'] for a in existing_assets}.issubset(set(names)), 'Unrecognized existing assets')
          by_name = {a['name']: a for a in existing_assets}
          for name, data in assets.items():
              if name in by_name:
                  require(by_name[name]['state'] == 'uploaded' and by_name[name]['size'] == len(data), 'Existing asset not complete')
                  require(by_name[name].get('digest') == 'sha256:' + digest(data), 'Existing asset hash differs; never overwrite')
                  continue
              require(release['draft'], 'Published release is missing an asset; stop for review')
              upload = release['upload_url'].split('{', 1)[0]
              require(urlparse(upload).scheme == 'https' and urlparse(upload).hostname == 'uploads.github.com', 'Unexpected upload host')
              headers = dict(HEADERS, **{'Content-Type': 'application/zip' if name.endswith('.zip') else 'application/octet-stream'})
              with urlopen(Request(upload + '?' + urlencode({'name': name}), data=data, headers=headers), timeout=120) as response:
                  asset = json.load(response)
              require(asset['name'] == name and asset['state'] == 'uploaded' and asset['size'] == len(data), 'Upload failed')
              require(asset.get('digest') == 'sha256:' + digest(data), 'Uploaded asset digest mismatch')
              by_name[name] = asset

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def download_draft_asset(asset):
              require(asset['url'].startswith(API + 'releases/assets/'), 'Unexpected asset endpoint')
              headers = dict(HEADERS, Accept='application/octet-stream')
              try:
                  with build_opener(NoRedirect()).open(Request(asset['url'], headers=headers), timeout=90) as response:
                      return response.read()
              except HTTPError as error:
                  require(error.code in (301, 302, 303, 307, 308), 'Unexpected draft download error: ' + str(error.code))
                  target = error.headers['Location']
                  parsed = urlparse(target)
                  require(parsed.scheme == 'https' and parsed.hostname.endswith('.githubusercontent.com'), 'Unexpected asset redirect')
                  with urlopen(Request(target, headers={'User-Agent': 'approved-idl-release'}), timeout=120) as response:
                      return response.read()
          for name, asset in by_name.items():
              require(download_draft_asset(asset) == assets[name], 'Downloaded draft bytes differ: ' + name)
          if release['draft']:
              require(api('git/ref/heads/main')['object']['sha'] == RELEASE_SHA, 'Main moved before publication')
              release = api(f"releases/{release['id']}", {'draft': False, 'prerelease': False, 'make_latest': 'true'}, method='PATCH')
          require(not release['draft'] and not release['prerelease'] and release['published_at'], 'Release was not published')
          require(api('git/ref/tags/' + TAG)['object']['sha'] == RELEASE_SHA, 'Tag drift after publication')
          require(api('releases/latest')['id'] == release['id'], 'Latest release identity differs')
          verified = []
          for asset in api(f"releases/{release['id']}/assets?per_page=100"):
              name = asset['name']
              require(name in assets, 'Unexpected public asset')
              url = asset['browser_download_url']
              require(url.startswith(f'https://github.com/{REPO}/releases/download/{TAG}/'), 'Unexpected public download URL')
              with urlopen(Request(url, headers={'User-Agent': 'approved-idl-release'}), timeout=120) as response:
                  downloaded = response.read()
              require(downloaded == assets[name], 'Public downloaded bytes differ: ' + name)
              verified.append({'name': name, 'sha256': digest(downloaded), 'size': len(downloaded)})
          require({a['name'] for a in verified} == set(names), 'Incomplete public asset verification')
          run([sys.executable, '-B', 'scripts/verify_release_docs.py', '--github'])
          run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'])
          require(not git('diff', '--name-only', '--', 'plugins', 'scripts', 'tests', 'releases'), 'Release bytes changed')
          tree_elements = []
          for path in changed:
              data = (ROOT / path).read_bytes()
              blob = api('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              require(blob['sha'] == expected, 'Uploaded documentation mismatch')
              tree_elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          receipt = {'version': VERSION, 'release_commit': RELEASE_SHA, 'release_url': release['html_url'],
                     'release_id': release['id'], 'published_at': release['published_at'],
                     'execution_commit': git('rev-parse', 'HEAD'), 'verified_release_run': VERIFY_RUN,
                     'verified_documentation_run': DOCS_RUN, 'assets': verified, 'package_verifier': 'pass',
                     'repository_regressions': '38 passed', 'documentation_preflight_and_online_check': 'pass',
                     'installation': 'not performed', 'main_documentation': 'verified blobs prepared, not yet committed',
                     'tree_elements': tree_elements}
          print('PUBLICATION_RECEIPT\n' + json.dumps(receipt, indent=2), flush=True)
          (ROOT / '.verification/publication-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Published verified 1.1.30\n\n' + release['html_url'] + '\n\nRelease commit: `' + RELEASE_SHA + '`.\n\nAll four public downloads match committed bytes; 38 repository tests and package verification passed. Companion documentation is prepared as verified blobs for a separate commit. No installation performed.\n')
          PY
